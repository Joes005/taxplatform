services:
  postgres:
    image: postgres:16-alpine
    container_name: taxplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxplatform
      POSTGRES_PASSWORD: taxplatform
      POSTGRES_DB: taxplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxplatform -d taxplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: taxplatform-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://taxplatform:taxplatform@postgres:5432/taxplatform
      DATABASE_URL_SYNC: postgresql+psycopg2://taxplatform:taxplatform@postgres:5432/taxplatform
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: taxplatform-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
